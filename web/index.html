<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Los marcadores en mayúsculas son los metadatos de cada idioma (src/i18n/meta.ts): vite.config.ts genera / y /en/ -->
    <meta name="description" content="__DESCRIPTION__" />
    <link rel="canonical" href="__URL__" />
    <link rel="alternate" hreflang="es" href="https://isbtccheap.com/" />
    <link rel="alternate" hreflang="en" href="https://isbtccheap.com/en/" />
    <link rel="alternate" hreflang="x-default" href="https://isbtccheap.com/en/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="__OG_LOCALE__" />
    <meta property="og:url" content="__URL__" />
    <meta property="og:title" content="__TITLE__" />
    <meta property="og:description" content="__DESCRIPTION__" />
    <meta property="og:image" content="https://isbtccheap.com/logo.jpg" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.jpg" />
    <link rel="preload" as="image" href="/logo.jpg" />
    <meta name="theme-color" content="#0f1217" />
    <title>__TITLE__</title>
    <!-- Datos estructurados: le dicen a Google qué es la web (una aplicación financiera gratuita) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Is BTC Cheap?",
        "url": "__URL__",
        "description": "__DESCRIPTION__",
        "inLanguage": "__LANG__",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Jaterli", "url": "https://jaterli.com" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
