server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Detrás del reverse proxy: las redirecciones (/en → /en/) no deben llevar el puerto interno
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # 404 de verdad, no la portada con 200 (un "soft 404" para los buscadores)
    error_page 404 /404.html;

    # Con hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /data/ {
        add_header Cache-Control "no-cache";
    }

    # Noticias y agenda (volumen de news/out). Si aún no existen, 404 y la web oculta la tarjeta
    location /news/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Sin caché: tras un despliegue el navegador debe pedir los nuevos ficheros de /assets/
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
