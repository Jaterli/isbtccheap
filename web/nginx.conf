server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Detrás del reverse proxy: las redirecciones (p. ej. /en → /en/) no deben llevar el puerto interno
    absolute_redirect off;

    # Compresión: el JavaScript pasa de ~240 KB a ~75 KB (text/html se comprime siempre)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Solo existen / y /en/: el resto es un 404 de verdad (antes devolvía la portada con 200, un "soft 404")
    error_page 404 /404.html;

    # Ficheros con hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JSON del pipeline: cambian cada día
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    # Noticias y agenda (volumen de news/out): cambian cada 15 min. Si aún no existen, 404 y la web oculta la tarjeta
    location /news/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html sin caché: tras un despliegue el navegador debe pedir los nuevos ficheros de /assets/
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
