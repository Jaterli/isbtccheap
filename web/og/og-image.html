<!doctype html>
<!--
  Plantilla de la imagen para redes sociales (og:image, 1200×630). No se publica: genera web/public/og-es.png y
  og-en.png con una captura de Chrome a 1200×630 de og-image.html?lang=es / ?lang=en (ver web/og/README.md).
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        display: flex; align-items: center; gap: 64px; padding: 0 80px;
        background: radial-gradient(circle at 85% 10%, rgb(247 147 26 / 0.18), transparent 45%), #0f1115;
        color: #eceef2; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      }
      .logo { width: 380px; height: 380px; flex: none; border-radius: 36px; box-shadow: 0 20px 60px rgb(0 0 0 / 0.5); }
      .text { display: grid; gap: 22px; }
      .kicker { color: #f7931a; font-size: 24px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 66px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; }
      p { margin: 0; color: #9aa1ad; font-size: 28px; line-height: 1.35; }
      .scale { display: grid; gap: 8px; margin-top: 6px; }
      .bands { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .bands span { height: 14px; border-radius: 7px; }
      .ends { display: flex; justify-content: space-between; color: #9aa1ad; font-size: 20px; }
      .url { color: #eceef2; font-size: 26px; font-weight: 600; }
    </style>
  </head>
  <body>
    <img class="logo" src="../public/logo-isbtccheap_v2.png" alt="" />
    <div class="text">
      <div class="kicker" data-t="kicker"></div>
      <h1 data-t="title"></h1>
      <p data-t="subtitle"></p>
      <div class="scale">
        <div class="bands">
          <span style="background: #1a9850"></span><span style="background: #8cc152"></span><span style="background: #c9b84a"></span>
          <span style="background: #f08a4b"></span><span style="background: #d73027"></span>
        </div>
        <div class="ends"><span data-t="cheap"></span><span data-t="expensive"></span></div>
      </div>
      <div class="url">isbtccheap.com</div>
    </div>
    <script>
      const T = {
        es: {
          kicker: "Índice de 1 a 100",
          title: "¿Está Bitcoin barato o caro?",
          subtitle: "Valoración on‑chain, ciclo, liquidez, sentimiento y análisis técnico en un solo índice.",
          cheap: "1 · Barato",
          expensive: "Caro · 100",
        },
        en: {
          kicker: "1 to 100 index",
          title: "Is Bitcoin cheap or expensive?",
          subtitle: "On‑chain valuation, cycle, liquidity, sentiment and technical analysis in a single index.",
          cheap: "1 · Cheap",
          expensive: "Expensive · 100",
        },
      };
      const t = T[new URLSearchParams(location.search).get("lang")] ?? T.es;
      document.documentElement.lang = t === T.en ? "en" : "es";
      for (const el of document.querySelectorAll("[data-t]")) el.textContent = t[el.dataset.t];
    </script>
  </body>
</html>
