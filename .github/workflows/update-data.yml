name: Actualizar datos diarios

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC, cuando Coin Metrics ya ha publicado el día anterior
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Calcular score
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }} # opcional
        run: python pipeline/build.py

      - name: Commit de los datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          git diff --cached --quiet || git commit -m "datos: actualización diaria $(date -u +%F)"
          git push
